services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: patient_registration_db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - patient_network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: patient_registration_backend
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:password@postgres:5432/postgres?schema=public}
      - PORT=${PORT:-3001}
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key}
      - SMTP_HOST=${SMTP_HOST:-smtp.mailtrap.io}
      - SMTP_PORT=${SMTP_PORT:-2525}
      - SMTP_USER=${SMTP_USER:-your-mailtrap-username}
      - SMTP_PASS=${SMTP_PASS:-your-mailtrap-password}
      - FROM_EMAIL=${FROM_EMAIL:-noreply@patientapp.com}
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/uploads:/app/uploads
    depends_on:
      - postgres
    networks:
      - patient_network
    command: npm run dev

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: patient_registration_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - patient_network
    command: npm run dev

volumes:
  postgres_data:

networks:
  patient_network:
    driver: bridge
